name: Container QC

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      rehearsal_from:
        description: Baseline release tag for the upgrade rehearsal (auto = previous stable release)
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      rehearsal_from:
        description: Baseline release tag for the upgrade rehearsal (auto = previous stable release)
        type: string
        default: auto

permissions:
  contents: read

concurrency:
  group: container-qc-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  container:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # PR and push runs keep the original limit; the upgrade rehearsal needs more.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && 60 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            node-arch: x64
            runner: ubuntu-24.04
            emulated: arm64
            emulated-machine: aarch64
          - arch: arm64
            node-arch: arm64
            runner: ubuntu-24.04-arm
            emulated: amd64
            emulated-machine: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out event commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate download-only production configuration
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          cp docker-compose.release.yml "$fixture/"
          cp .env.example "$fixture/.env"
          docker compose -f "$fixture/docker-compose.release.yml" config --format json > "$fixture/config.json"
          node - "$fixture/config.json" <<'NODE'
          const assert = require("node:assert/strict");
          const { services } = require(process.argv[2]);
          assert.equal(services.app.image, "ghcr.io/joe-cole1/rsvp-to-me:latest");
          assert.equal(services.app.build, undefined);
          assert.equal(services.app.profiles, undefined);
          assert.equal(services.app.environment.SEED_TEST_DATA, "false");
          assert.equal(services.app.environment.OPEN_REGISTRATION, "false");
          assert.equal(services.postgres.ports, undefined);
          assert.equal(services.redis.ports, undefined);
          console.log("Download-only production Compose configuration passed");
          NODE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Check cross-platform emulation
        env:
          EMULATED_ARCH: ${{ matrix.emulated }}
          EXPECTED_MACHINE: ${{ matrix.emulated-machine }}
        run: |
          actual=$(docker run --rm --network none --platform "linux/$EMULATED_ARCH" alpine:3.24 uname -m)
          test "$actual" = "$EXPECTED_MACHINE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Native runners keep both real release architectures practical to check
      # on every PR. The image is loaded only into this disposable runner.
      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: rsvp-container-qc:local
          cache-from: type=gha,scope=container-qc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-qc-${{ matrix.arch }}

      - name: Smoke-test candidate image
        timeout-minutes: 5
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node-arch }}
        run: bash scripts/container-smoke.sh rsvp-container-qc:local "$EXPECTED_NODE_ARCH"

      # Pre-release upgrade check: only manual runs and the Release gate (a
      # workflow_call keeps the caller's "release" event). PRs and pushes skip it.
      # It seeds the previous release through its own code, upgrades that data
      # to this candidate and rehearses the rollback, on an internal network with
      # a capture transport. It pulls only the public baseline image.
      - name: Fetch release history for the upgrade rehearsal
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow --tags origin
          else
            git fetch --quiet --tags origin
          fi

      - name: Rehearse upgrade and rollback
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        timeout-minutes: 25
        env:
          REHEARSAL_FROM: ${{ inputs.rehearsal_from || 'auto' }}
        run: bash scripts/upgrade-rehearsal.sh --from "$REHEARSAL_FROM" --to-image rsvp-container-qc:local
