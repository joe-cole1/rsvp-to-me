name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-ci:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-container:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    uses: ./.github/workflows/container-qc.yml
    permissions:
      contents: read

  docker:
    needs: [validate-ci, validate-container]
    # Check both identities: reruns retain the original github.actor.
    # Repository Actions policies provide a separate pre-execution boundary.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checked-out event commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate release image tags
        id: release-tags
        run: node scripts/release-image-tags.cjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          # All aliases come from the tested policy, including latest. Do not
          # let metadata-action add an implicit latest tag for prereleases.
          flavor: latest=false
          tags: ${{ steps.release-tags.outputs.tags }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
