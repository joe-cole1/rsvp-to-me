# Batch routine updates weekly; security updates use separate groups and bypass
# the version-update schedule and cooldown. See docs/admin/local-development.md.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    ignore:
      # Upgrade Node's runtime and declaration major together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      app-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Preserve coupled package families for major upgrades. Routine updates
      # match app-routine first; unrelated majors remain individual PRs.
      next-toolchain:
        patterns: ["next", "eslint-config-next"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      prisma:
        patterns: ["prisma", "@prisma/*", "@libsql/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      react-email:
        patterns: ["react-email", "@react-email/*"]
      app-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      worker-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      worker-security:
        applies-to: security-updates
        patterns: ["*"]
